openapi: 3.0.1
info:
  title: ''
  description: ''
  version: 1.0.0
paths:
  /:
    post:
      summary: SEARCH
      deprecated: false
      description: >+
        ## Multi-product feature updates

        2025.11 Update: Search interface RQ add tag field, RS add tag,
        otherFareRules, etc. field. Support multi-product function.






        ## Branded fare feature notice

        1. If "returnTagPrice" value be "Y" in the request, suppliers are
        expected to send all branded fare solution tags together with a lowest
        price solution (for each flight) without tag



        2. If "returnTagPrice" value be "N" in the request, suppliers are
        expected to send the lowest price solution (for each flight) without tag
        only





        ## Error Code

        | **Code**<img width=200/> |
        **Explanation**                                                                                                          
        |

        |----------|---------------------------------------------------------------------------------------------------------------------------|

        | 0        |
        Success                                                                                                                  
        |

        | 3        | Failed due to other
        reasons.                                                                                             
        |

        | 4        | Request Parameters
        error.                                                                                                
        |

        | 5        | Program
        exception.                                                                                             


        Notes：

        When receiving a request but have no corresponding contents, please
        return an empty list like this:{"status": 0,"msg":
        "success","shoppingResultList":[],"flightList":[]}






      tags:
        - >-
          English Version/Supplier Content Aggregation Direct Connection
          API_v2.1
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                adultNumber:
                  type: integer
                  description: >-
                    Number of adults, 1-9. Please return relevant fare data
                    based on the actual type of travelers in the request.

                    Note: Number of passengers must be provided in the Search
                    request.
                arrCity:
                  type: string
                  description: Destination City (IATA Three-Letter Code)
                cabinClass:
                  type: string
                  description: >-
                    Cabin class:

                    First Class: F

                    Business Class: C

                    Premium Economy: S

                    Economy Class: Y

                    The default will be Economy Class when there is no value
                    provided in the request.
                childNumber:
                  type: integer
                  description: Number of children, 0-9
                cutOffTime:
                  type: integer
                  description: |-
                    Buyer-side cutoff time configuration.
                    Unit: milliseconds
                depCity:
                  type: string
                  description: >-
                    Departure City (IATA Three-Letter Code)

                    Note: The request is for cities, not airports (does not
                    support multiple cities).
                fromDate:
                  type: string
                  description: |
                    Departure date, formatted as YYYYMMDD. 
                    Does not support multiple dates.
                infantNumber:
                  type: integer
                  description: Number of infants, 0-9
                retDate:
                  type: string
                  description: Return date, formatted as YYYYMMDD
                returnTagPrice:
                  type: string
                  description: >-
                    Product tag, fill in the code as specified by PKFARE, this
                    version only supports to fill in one; when the request fills
                    in the tag, the supply only needs to return the quotation of
                    each flight corresponding to the tag, and there is still
                    only one price for each flight; when the request doesn't
                    fill in the tag and the supply supports to return more than
                    one price, the supply can return several quotations of each
                    flight with different tags, and there may be more than one
                    price for each flight.
                tag:
                  type: string
                  description: >-
                    Y-returns a multi-product offer (i.e. Tag product price),
                    N-does not return a multi-product offer (still returns the
                    lowest price in the original mode)
                tripType:
                  type: string
                  description: '1: One-Way 2: Round-trip'
                vendorCode:
                  type: string
                  description: |
                    Interface Identity: Username (Channel Unique Identifier)
              required:
                - adultNumber
                - arrCity
                - cabinClass
                - childNumber
                - cutOffTime
                - depCity
                - fromDate
                - infantNumber
                - retDate
                - tripType
                - vendorCode
              x-apifox-orders:
                - adultNumber
                - arrCity
                - cabinClass
                - childNumber
                - cutOffTime
                - depCity
                - fromDate
                - infantNumber
                - retDate
                - tripType
                - vendorCode
                - returnTagPrice
                - tag
            example:
              adultNumber: 1
              arrCity: NYC
              cabinClass: 'Y'
              childNumber: 0
              cutOffTime: 28000
              depCity: HOU
              fromDate: '20251030'
              infantNumber: 0
              retDate: '20251031'
              returnTagPrice: 'Y'
              tag: ''
              tripType: '2'
              vendorCode: SHA-**
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Refer to the ‘Response Error Codes’ section
                  msg:
                    type: string
                    description: status information, length less than 64
                  shoppingResultList:
                    type: array
                    items:
                      type: object
                      properties:
                        flightRefList:
                          type: array
                          items:
                            type: object
                            properties:
                              flightRefNum:
                                type: integer
                                description: Flight Index
                              travelDirection:
                                type: integer
                                description: "Segment identifier, 1: outbound, 2: return\t"
                              flightSeq:
                                type: integer
                                description: >-
                                  Segment order within the itinerary, starting
                                  from 1 for outbound and return segments
                                  respectively.
                              ticketSeq:
                                type: integer
                                description: >-
                                  The ticket number, assigned starting from 1,
                                  with the first ticket assigned the value of 1.
                                  Multiple values are only applicable when the
                                  supplier organizes a multi-ticket product.

                                  Not supported temporarily, default value is
                                  set to 1
                              cabinClass:
                                type: string
                                description: >-
                                  Cabin Class; First Class: F; Business Class:
                                  C; Premium Economy Class: S (Available for
                                  both full-service and budget airlines, contact
                                  us for configuration); Economy Class: Y
                              rbd:
                                type: string
                                description: booking Code (supporting 1-2 characters)
                              seatCount:
                                type: integer
                                description: >-
                                  Quantity of rbd, return 9 if the number of
                                  seats exceeds 9.
                            required:
                              - flightRefNum
                              - travelDirection
                              - flightSeq
                              - ticketSeq
                              - cabinClass
                              - rbd
                              - seatCount
