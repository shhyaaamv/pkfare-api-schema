name: 2 Publish version
on:
  workflow_dispatch:
    inputs:
      major_version:
        description: 'RELEASE version'
        required: false
        type: string
      minor_version:
        description: 'Next SNAPSHOT version'
        required: false
        type: string
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AWS_DEFAULT_REGION: 'ap-south-1'
  APP_DOMAIN: vdc-repository
  DOMAIN_OWNER: 683455398069
jobs:
  release-version:
    runs-on: self-hosted-arm64
    environment: release
    permissions:
      contents: read
    steps:
      # A GitHub App token is used instead of GITHUB_TOKEN so that the version tag pushed by
      # the release task triggers the "3 Deploy artifact" workflow.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - name: Configure git credentials
        run: |
          git config --global user.email "ci.builder@verteil.com"
          git config --global user.name "CI Builder"
      - name: Update versions
        run: |
          export CODEARTIFACT_AUTH_TOKEN=`aws codeartifact get-authorization-token --domain $APP_DOMAIN --domain-owner $DOMAIN_OWNER --query authorizationToken --output text`
          ./mvnw -Dmaven.repo.local=$HOME/.m2/repository -B release:prepare -Darguments="-Dmaven.repo.local=$HOME/.m2/repository" -DreleaseVersion=${{ github.event.inputs.major_version }} -DdevelopmentVersion=${{ github.event.inputs.minor_version }}
