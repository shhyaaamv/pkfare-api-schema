name: 1 Run Maven build on pull request
on: pull_request
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: 'ap-south-1'
  APP_DOMAIN: vdc-repository
  DOMAIN_OWNER: 683455398069
jobs:
  build:
    name: Run Maven build
    runs-on: self-hosted-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - name: Build and analyze
        run: |
          export CODEARTIFACT_AUTH_TOKEN=`aws codeartifact get-authorization-token --domain $APP_DOMAIN --domain-owner $DOMAIN_OWNER --query authorizationToken --output text`
          ./mvnw -Dmaven.repo.local=$HOME/.m2/repository -s .mvn/settings.xml -B clean install
