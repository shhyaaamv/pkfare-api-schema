name: 3 Deploy artifact to repository
on:
  push:
    tags:
      - pkfare-api-schema-**
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: 'ap-south-1'
  APP_DOMAIN: vdc-repository
  DOMAIN_OWNER: 683455398069
jobs:
  deploy-artifacts:
    runs-on: self-hosted-arm64
    permissions:
      # Required by the "Github Release" step to create the release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - name: Deploy artifacts
        run: |
          export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain $APP_DOMAIN --domain-owner $DOMAIN_OWNER --query authorizationToken --output text)
          ./mvnw -Dmaven.repo.local=$HOME/.m2/repository -s .mvn/settings.xml -B clean install deploy
      - name: Github Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: target/pkfare-api-schema-*.jar
